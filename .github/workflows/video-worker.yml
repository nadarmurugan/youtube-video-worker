name: FFmpeg Video Worker

on:
  workflow_dispatch:

jobs:
  process-video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Generate test video
        run: |
          ffmpeg \
            -f lavfi \
            -i testsrc=duration=10:size=1280x720:rate=30 \
            -f lavfi \
            -i sine=frequency=1000:duration=10 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            input.mp4

      - name: Add text to video
        run: |
          ffmpeg \
            -i input.mp4 \
            -vf "drawtext=text='My AI Video':fontsize=40:x=(w-text_w)/2:y=40" \
            -c:a copy \
            output.mp4

      - name: Check output
        run: |
          echo "Input video:"
          ls -lh input.mp4

          echo "Output video:"
          ls -lh output.mp4

          echo "Video information:"
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output.mp4

      - name: Upload processed video
        uses: actions/upload-artifact@v4
        with:
          name: processed-video
          path: output.mp4
