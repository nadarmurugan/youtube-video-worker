name: FFmpeg Video Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Video job ID from Apps Script / Supabase"
        required: true
        type: string
        default: "PIXAZO_4_SCENE_TEST"

permissions:
  contents: read

jobs:
  process-video:
    name: Render AI Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RCLONE_FILE: ${{ github.workspace }}/.rclone/rclone.conf

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================

      - name: Install FFmpeg jq Python and rclone
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING REQUIRED TOOLS"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            python3 \
            python3-venv \
            curl \
            ca-certificates \
            unzip

          echo ""
          echo "Installing rclone v1.75.1..."

          curl -L \
            "https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip" \
            -o /tmp/rclone.zip

          rm -rf /tmp/rclone
          mkdir -p /tmp/rclone

          unzip -q \
            /tmp/rclone.zip \
            -d /tmp/rclone

          sudo cp \
            /tmp/rclone/rclone-v1.75.1-linux-amd64/rclone \
            /usr/local/bin/rclone

          sudo chmod +x /usr/local/bin/rclone

          echo ""
          echo "Tools installed successfully."


      # ============================================================
      # 3. VERIFY TOOLS
      # ============================================================

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TOOL VERSIONS"
          echo "========================================"

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo ""
          echo "rclone:"
          rclone version | head -n 3

          echo ""
          echo "jq:"
          jq --version

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "All tools are available."


      # ============================================================
      # 4. CONFIGURE RCLONE
      # ============================================================

      - name: Configure rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURING RCLONE"
          echo "========================================"

          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "ERROR: RCLONE_CONFIG_B64 secret is empty."
            exit 1
          fi

          mkdir -p "$(dirname "$RCLONE_FILE")"

          echo "Decoding rclone configuration..."

          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RCLONE_FILE"

          chmod 600 "$RCLONE_FILE"

          if [ ! -s "$RCLONE_FILE" ]; then
            echo "ERROR: rclone configuration is empty."
            exit 1
          fi

          echo ""
          echo "Configured remotes:"

          rclone \
            --config "$RCLONE_FILE" \
            listremotes


      # ============================================================
      # 5. TEST GOOGLE DRIVE
      # ============================================================

      - name: Test Google Drive
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TESTING GOOGLE DRIVE"
          echo "========================================"

          echo ""
          echo "Testing gdrive remote..."

          rclone \
            --config "$RCLONE_FILE" \
            lsd gdrive:

          echo ""
          echo "Testing AI VIDEO AUTOMATION..."

          rclone \
            --config "$RCLONE_FILE" \
            lsd "gdrive:AI VIDEO AUTOMATION"

          echo ""
          echo "Google Drive connection successful."


      # ============================================================
      # 6. PREPARE JOB
      # ============================================================

      - name: Prepare job
        shell: bash
        env:
          INPUT_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING VIDEO JOB"
          echo "========================================"

          if [ -z "$INPUT_JOB_ID" ]; then
            echo "ERROR: job_id is empty."
            exit 1
          fi

          JOB_FOLDER="job_${INPUT_JOB_ID}"

          CLIP_SOURCE="gdrive:AI VIDEO AUTOMATION/02_AI_ASSETS/VIDEO_CLIPS/${JOB_FOLDER}"

          PLAN_SOURCE="gdrive:AI VIDEO AUTOMATION/01_SCRIPTS/${JOB_FOLDER}/video_plan.json"

          RENDER_DEST="gdrive:AI VIDEO AUTOMATION/03_RENDERED"

          echo "JOB_ID=$INPUT_JOB_ID" >> "$GITHUB_ENV"
          echo "JOB_FOLDER=$JOB_FOLDER" >> "$GITHUB_ENV"
          echo "CLIP_SOURCE=$CLIP_SOURCE" >> "$GITHUB_ENV"
          echo "PLAN_SOURCE=$PLAN_SOURCE" >> "$GITHUB_ENV"
          echo "RENDER_DEST=$RENDER_DEST" >> "$GITHUB_ENV"

          mkdir -p \
            input \
            work \
            work/normalized \
            output

          echo ""
          echo "JOB CONFIGURATION"
          echo "----------------------------------------"
          echo "JOB_ID      : $INPUT_JOB_ID"
          echo "JOB_FOLDER  : $JOB_FOLDER"
          echo "CLIP_SOURCE : $CLIP_SOURCE"
          echo "PLAN_SOURCE : $PLAN_SOURCE"
          echo "RENDER_DEST : $RENDER_DEST"


      # ============================================================
      # 7. CHECK PIXAZO FOLDER
      # ============================================================

      - name: Check Pixazo folder
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKING PIXAZO CLIP FOLDER"
          echo "========================================"

          rclone \
            --config "$RCLONE_FILE" \
            lsf "$CLIP_SOURCE"

          echo ""
          echo "Pixazo folder found."


      # ============================================================
      # 8. DOWNLOAD FOUR SCENES
      # ============================================================

      - name: Download Pixazo scenes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DOWNLOADING PIXAZO SCENES"
          echo "========================================"

          rclone \
            --config "$RCLONE_FILE" \
            copy "$CLIP_SOURCE" input \
            --include "scene_01.mp4" \
            --include "scene_02.mp4" \
            --include "scene_03.mp4" \
            --include "scene_04.mp4" \
            --progress

          echo ""
          echo "Downloaded files:"
          ls -lh input


      # ============================================================
      # 9. VERIFY SCENES
      # ============================================================

      - name: Verify Pixazo scenes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING PIXAZO SCENES"
          echo "========================================"

          for FILE in \
            input/scene_01.mp4 \
            input/scene_02.mp4 \
            input/scene_03.mp4 \
            input/scene_04.mp4
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: Missing input:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "All four scenes are available."


      # ============================================================
      # 10. INSPECT ORIGINAL CLIPS
      # ============================================================

      - name: Inspect Pixazo clips
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PIXAZO CLIP INFORMATION"
          echo "========================================"

          for FILE in \
            input/scene_01.mp4 \
            input/scene_02.mp4 \
            input/scene_03.mp4 \
            input/scene_04.mp4
          do
            echo ""
            echo "----------------------------------------"
            echo "$FILE"
            echo "----------------------------------------"

            ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -of default=noprint_wrappers=1 \
              "$FILE"
          done


      # ============================================================
      # 11. PREPARE TITLE AND VOICEOVER
      # ============================================================

      - name: Prepare title and voiceover
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING TITLE AND VOICEOVER"
          echo "========================================"

          if rclone \
            --config "$RCLONE_FILE" \
            lsf "$PLAN_SOURCE" >/dev/null 2>&1
          then

            echo "video_plan.json found."

            rclone \
              --config "$RCLONE_FILE" \
              copyto \
              "$PLAN_SOURCE" \
              "work/video_plan.json"

            test -s "work/video_plan.json"

            jq -r '.title // "AI Video"' \
              work/video_plan.json \
              | cut -c1-70 \
              > work/title.txt

            jq -r '.voiceover // empty' \
              work/video_plan.json \
              > work/voiceover.txt

          else

            echo "video_plan.json not found."
            echo "Using test title and test voiceover."

            printf '%s\n' \
              'AI Video Automation Test' \
              > work/title.txt

            printf '%s\n' \
              'Welcome to this AI video automation test. These scenes were generated using Pixazo and are now being processed automatically with FFmpeg inside GitHub Actions. The video worker downloads the AI generated scenes from Google Drive, combines them, creates the voiceover and subtitles, and produces the final vertical video.' \
              > work/voiceover.txt
          fi

          if [ ! -s "work/title.txt" ]; then
            echo "ERROR: Title is empty."
            exit 1
          fi

          if [ ! -s "work/voiceover.txt" ]; then
            echo "ERROR: Voiceover text is empty."
            exit 1
          fi

          echo ""
          echo "TITLE"
          echo "----------------------------------------"
          cat work/title.txt

          echo ""
          echo "VOICEOVER"
          echo "----------------------------------------"
          cat work/voiceover.txt


      # ============================================================
      # 12. NORMALIZE FOUR SCENES
      # ============================================================

      - name: Normalize Pixazo scenes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "NORMALIZING PIXAZO SCENES"
          echo "========================================"

          for NUMBER in 01 02 03 04
          do
            INPUT="input/scene_${NUMBER}.mp4"
            OUTPUT="work/normalized/scene_${NUMBER}.mp4"

            echo ""
            echo "Processing $INPUT"

            ffmpeg \
              -y \
              -i "$INPUT" \
              -t 4 \
              -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,fps=24,setsar=1" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$OUTPUT"
          done

          echo ""
          echo "Normalized clips:"
          ls -lh work/normalized


      # ============================================================
      # 13. VERIFY NORMALIZED CLIPS
      # ============================================================

      - name: Verify normalized clips
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING NORMALIZED CLIPS"
          echo "========================================"

          for FILE in \
            work/normalized/scene_01.mp4 \
            work/normalized/scene_02.mp4 \
            work/normalized/scene_03.mp4 \
            work/normalized/scene_04.mp4
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: Missing normalized clip:"
              echo "$FILE"
              exit 1
            fi

            echo ""
            echo "$FILE"

            ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -of default=noprint_wrappers=1 \
              "$FILE"
          done


      # ============================================================
      # 14. CREATE CONCAT LIST
      # ============================================================

      - name: Create concat list
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CREATING CONCAT LIST"
          echo "========================================"

          printf '%s\n' \
            "file 'normalized/scene_01.mp4'" \
            "file 'normalized/scene_02.mp4'" \
            "file 'normalized/scene_03.mp4'" \
            "file 'normalized/scene_04.mp4'" \
            > work/concat.txt

          echo ""
          cat work/concat.txt


      # ============================================================
      # 15. MERGE FOUR SCENES
      # ============================================================

      - name: Merge four Pixazo scenes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "MERGING FOUR PIXAZO SCENES"
          echo "========================================"

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i work/concat.txt \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            work/merged_16sec.mp4

          test -s work/merged_16sec.mp4

          echo ""
          echo "MERGED VIDEO INFORMATION"
          echo "----------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/merged_16sec.mp4


      # ============================================================
      # 16. CREATE 60 SECOND SILENT VIDEO
      # ============================================================

      - name: Create 60 second silent video
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CREATING 60 SECOND SILENT VIDEO"
          echo "========================================"

          ffmpeg \
            -y \
            -stream_loop -1 \
            -i work/merged_16sec.mp4 \
            -t 60 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            work/video_60sec_silent.mp4

          test -s work/video_60sec_silent.mp4

          echo ""
          echo "60 SECOND VIDEO INFORMATION"
          echo "----------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/video_60sec_silent.mp4


      # ============================================================
      # 17. INSTALL EDGE TTS
      # ============================================================

      - name: Install Edge TTS
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING EDGE TTS"
          echo "========================================"

          python3 \
            -m venv \
            work/tts-venv

          work/tts-venv/bin/python \
            -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            edge-tts

          echo ""
          echo "Edge TTS installed."


      # ============================================================
      # 18. GENERATE VOICEOVER
      # ============================================================

      - name: Generate voiceover
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERATING VOICEOVER"
          echo "========================================"

          work/tts-venv/bin/edge-tts \
            --file work/voiceover.txt \
            --voice en-US-GuyNeural \
            --write-media work/voice.mp3 \
            --write-subtitles work/voice.srt

          test -s work/voice.mp3
          test -s work/voice.srt

          echo ""
          echo "Voiceover generated."

          ls -lh \
            work/voice.mp3 \
            work/voice.srt


      # ============================================================
      # 19. INSPECT AUDIO
      # ============================================================

      - name: Inspect voiceover
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VOICEOVER INFORMATION"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/voice.mp3


      # ============================================================
      # 20. RENDER FINAL VIDEO
      #
      # 60 seconds
      # Vertical 720x1280
      # Title
      # Subtitles
      # Voiceover
      # AAC audio
      # ============================================================

      - name: Render final video
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RENDERING FINAL VIDEO"
          echo "========================================"

          FINAL="output/job_${JOB_ID}_final.mp4"

          ffmpeg \
            -y \
            -i work/video_60sec_silent.mp4 \
            -i work/voice.mp3 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=work/title.txt:fontcolor=white:fontsize=42:box=1:boxcolor=black@0.45:boxborderw=18:x=(w-text_w)/2:y=55,subtitles=work/voice.srt:force_style='FontName=DejaVu Sans,FontSize=18,Alignment=2,MarginV=150,Outline=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t 60 \
            -af "apad,atrim=duration=60" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "$FINAL"

          test -s "$FINAL"

          echo ""
          echo "FINAL VIDEO CREATED"
          echo "----------------------------------------"

          ls -lh "$FINAL"


      # ============================================================
      # 21. VERIFY FINAL VIDEO
      # ============================================================

      - name: Verify final video
        shell: bash
        run: |
          set -euo pipefail

          FINAL="output/job_${JOB_ID}_final.mp4"

          echo "========================================"
          echo "FINAL VIDEO VERIFICATION"
          echo "========================================"

          if [ ! -s "$FINAL" ]; then
            echo "ERROR: Final video does not exist."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          echo ""
          echo "Final video:"
          ls -lh "$FINAL"


      # ============================================================
      # 22. UPLOAD TO GOOGLE DRIVE
      # ============================================================

      - name: Upload final video to Google Drive
        shell: bash
        run: |
          set -euo pipefail

          FINAL="output/job_${JOB_ID}_final.mp4"

          echo "========================================"
          echo "UPLOADING FINAL VIDEO TO GOOGLE DRIVE"
          echo "========================================"

          rclone \
            --config "$RCLONE_FILE" \
            copy \
            "$FINAL" \
            "$RENDER_DEST" \
            --progress

          echo ""
          echo "Checking uploaded file..."

          rclone \
            --config "$RCLONE_FILE" \
            lsf \
            "$RENDER_DEST" \
            --include "job_${JOB_ID}_final.mp4"

          echo ""
          echo "FINAL VIDEO UPLOADED SUCCESSFULLY."


      # ============================================================
      # 23. GITHUB ARTIFACT
      # ============================================================

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-${{ inputs.job_id }}
          path: output/job_${{ inputs.job_id }}_final.mp4
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 24. COMPLETE
      # ============================================================

      - name: Pipeline complete
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "        AI VIDEO PIPELINE COMPLETE"
          echo "================================================"

          echo ""
          echo "Job ID:"
          echo "$JOB_ID"

          echo ""
          echo "Final video:"
          echo "job_${JOB_ID}_final.mp4"

          echo ""
          echo "Google Drive:"
          echo "$RENDER_DEST"

          echo ""
          echo "GitHub artifact:"
          echo "ai-video-${JOB_ID}"

          echo ""
          echo "================================================"
          echo "                  SUCCESS"
          echo "================================================"
